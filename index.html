<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>อาร์ทรักเปียร์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;1,9..144,400&family=Kanit:wght@300;400;500;600&family=Sarabun:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #FBF3EF;
    --card: #FFFFFF;
    --rose: #C97A86;
    --rose-deep: #A85D6C;
    --blush: #F6DFE1;
    --ink: #4A3639;
    --ink-soft: #8A7377;
    --line: #EAD9D4;
  }

  *{ box-sizing: border-box; margin:0; padding:0; }

  html,body{
    height:100%;
    min-height:100dvh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 12% 8%, rgba(201,122,134,0.07), transparent 40%),
      radial-gradient(circle at 88% 92%, rgba(201,122,134,0.08), transparent 45%);
    color: var(--ink);
    font-family: 'Sarabun', sans-serif;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px 16px;
    overflow-x:hidden;
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation: none !important; transition: none !important; }
  }

  .scene{
    position:relative;
    width:100%;
    max-width:400px;
  }

  .petal{
    position:absolute;
    border-radius:50% 0 50% 50%;
    background: var(--blush);
    opacity:0.55;
    filter: blur(0.5px);
    animation: drift 14s ease-in-out infinite;
  }
  .petal.p1{ width:26px; height:26px; top:-30px; left:0px; transform:rotate(20deg); animation-delay:0s; }
  .petal.p2{ width:16px; height:16px; top:20px; right:-18px; transform:rotate(-30deg); animation-delay:3s; background:var(--rose); opacity:0.35;}
  .petal.p3{ width:20px; height:20px; bottom:-22px; left:30px; transform:rotate(60deg); animation-delay:6s; }

  @keyframes drift{
    0%,100%{ transform: translateY(0) rotate(20deg); }
    50%{ transform: translateY(-14px) rotate(30deg); }
  }

  .card{
    position:relative;
    background: var(--card);
    border-radius: 24px;
    padding: 34px 24px 28px;
    box-shadow: 0 30px 60px -30px rgba(74,54,57,0.25), 0 2px 8px rgba(74,54,57,0.06);
    text-align:center;
    border: 1px solid var(--line);
  }

  .names{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:14px;
    font-family:'Kanit', sans-serif;
    font-weight:500;
    font-size: 1.15rem;
    letter-spacing:0.02em;
    color: var(--rose-deep);
  }

  .heart-link{
    width:18px;
    height:18px;
    flex-shrink:0;
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse{
    0%,100%{ transform: scale(1); }
    50%{ transform: scale(1.18); }
  }

  .eyebrow{
    margin-top:16px;
    font-family:'Kanit', sans-serif;
    font-size:0.75rem;
    font-weight:400;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color: var(--ink-soft);
  }

  .hero-number{
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:300;
    font-size: clamp(3.4rem, 18vw, 5.2rem);
    line-height:1;
    color: var(--ink);
    margin-top:6px;
    font-variant-numeric: tabular-nums;
  }

  .hero-label{
    font-family:'Kanit', sans-serif;
    font-size:0.95rem;
    color: var(--rose-deep);
    margin-top:4px;
    font-weight:400;
  }

  .divider{
    width:48px;
    height:1px;
    background: var(--line);
    margin: 20px auto;
  }

  .breakdown{
    display:flex;
    justify-content:center;
    gap: 16px;
  }
  .stat{
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
    min-width:48px;
  }
  .stat .num{
    font-family:'Fraunces', serif;
    font-weight:500;
    font-size:1.3rem;
    color: var(--rose-deep);
    font-variant-numeric: tabular-nums;
  }
  .stat .lbl{
    font-family:'Sarabun', sans-serif;
    font-size:0.68rem;
    color: var(--ink-soft);
  }

  .live-row{
    margin-top:18px;
    font-family:'Sarabun', sans-serif;
    font-size:0.78rem;
    color: var(--ink-soft);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:6px;
    flex-wrap:wrap;
  }
  .live-dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--rose);
    animation: blink 1.6s ease-in-out infinite;
  }
  @keyframes blink{
    0%,100%{ opacity:1; }
    50%{ opacity:0.25; }
  }
  .live-seconds{
    font-variant-numeric: tabular-nums;
    color: var(--rose-deep);
    font-weight:500;
  }

  .footer-note{
    margin-top:20px;
    padding-top:16px;
    border-top: 1px solid var(--line);
    font-size:0.72rem;
    color: var(--ink-soft);
    line-height:1.6;
  }
  .footer-note b{
    color: var(--ink);
    font-weight:500;
  }

  @media (max-width:360px){
    .card{ padding:28px 18px 24px; }
    .breakdown{ gap:10px; }
    .names{ font-size:1rem; gap:10px; }
  }

  @media (max-height:700px){
    .card{ padding:24px 24px 20px; }
    .eyebrow{ margin-top:12px; }
    .divider{ margin:14px auto; }
    .live-row{ margin-top:12px; }
    .footer-note{ margin-top:14px; padding-top:12px; }
  }
</style>
</head>
<body>

<div class="scene">
  <div class="petal p1"></div>
  <div class="petal p2"></div>
  <div class="petal p3"></div>

  <div class="card">
    <div class="names">
      <span>อาร์ท</span>
      <svg class="heart-link" viewBox="0 0 24 24" fill="none">
        <path d="M12 20.5s-7.5-4.7-10-9.4C0.3 7.8 2 4 5.6 4c2.1 0 3.6 1.2 4.4 2.6C10.8 5.2 12.3 4 14.4 4 18 4 19.7 7.8 22 11.1 19.5 15.8 12 20.5 12 20.5z" fill="#C97A86"/>
      </svg>
      <span>เปียร์</span>
    </div>

    <p class="eyebrow">คุยกันมาเเล้ว</p>
    <div class="hero-number" id="dayCount">0</div>
    <p class="hero-label">วัน</p>

    <div class="divider"></div>

    <div class="breakdown">
      <div class="stat">
        <span class="num" id="yearsNum">0</span>
        <span class="lbl">ปี</span>
      </div>
      <div class="stat">
        <span class="num" id="monthsNum">0</span>
        <span class="lbl">เดือน</span>
      </div>
      <div class="stat">
        <span class="num" id="restDaysNum">0</span>
        <span class="lbl">วัน</span>
      </div>
    </div>

    <div class="live-row">
      <span class="live-dot"></span>
      <span>นับต่อเนื่องมา <span class="live-seconds" id="liveSeconds">0</span> วินาที</span>
    </div>

    <div class="footer-note">
      ตั้งแต่วันที่ <b>31 พฤษภาคม 2569</b><br>
      รอเป็นเเฟนพี่เปียร์อยู่นะครับ 🥰
    </div>
  </div>
</div>

<script>
  // เริ่มนับ: 31 พฤษภาคม 2569 (ค.ศ. 2026)
  const startDate = new Date(2026, 4, 31, 0, 0, 0);

  function pad(n){ return n.toString(); }

  function update(){
    const now = new Date();
    let diffMs = now - startDate;
    if (diffMs < 0) diffMs = 0;

    const totalSeconds = Math.floor(diffMs / 1000);
    const totalDays = Math.floor(diffMs / (1000*60*60*24));

    // year / month / day breakdown
    let years = now.getFullYear() - startDate.getFullYear();
    let months = now.getMonth() - startDate.getMonth();
    let days = now.getDate() - startDate.getDate();

    if (days < 0){
      months -= 1;
      const prevMonth = new Date(now.getFullYear(), now.getMonth(), 0);
      days += prevMonth.getDate();
    }
    if (months < 0){
      years -= 1;
      months += 12;
    }

    document.getElementById('dayCount').textContent = totalDays.toLocaleString('th-TH');
    document.getElementById('yearsNum').textContent = years;
    document.getElementById('monthsNum').textContent = months;
    document.getElementById('restDaysNum').textContent = days;
    document.getElementById('liveSeconds').textContent = totalSeconds.toLocaleString('th-TH');
  }

  update();
  setInterval(update, 1000);
</script>

</body>
</html>
